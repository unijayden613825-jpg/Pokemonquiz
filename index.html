<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寶可夢大師知識挑戰賽</title>
    <style>
        :root {
            --primary-color: #ffcb05; /* 寶可夢黃 */
            --secondary-color: #3b4cca; /* 寶可夢藍 */
            --accent-color: #cc0000; /* 精靈球紅 */
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-size: 26px;
            text-shadow: 2px 2px 0px var(--primary-color);
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* 難度選擇畫面 */
        .difficulty-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-easy { background-color: #4CAF50; }
        .btn-medium { background-color: #FF9800; }
        .btn-hard { background-color: var(--accent-color); }

        /* 遊戲畫面 */
        .game-screen {
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            font-weight: bold;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #222;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #e1e4e8;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e9ecef;
            border-color: var(--secondary-color);
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }

        .next-btn {
            display: none;
            width: 100%;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 結果畫面 */
        .result-screen {
            display: none;
            text-align: center;
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 20px 0;
        }

        .result-comment {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ 寶可夢大師知識挑戰 ⚡</h1>
    <p class="subtitle">證明你對寶可夢世界的熟悉程度！</p>

    <!-- 難度選擇區 -->
    <div id="difficultySelection" class="difficulty-selection">
        <p style="text-align:center; font-weight: bold; margin-bottom: 5px;">請選擇挑戰難度：</p>
        <button class="btn btn-easy" onclick="startGame('easy')">🟢 初級訓練家 (簡單)</button>
        <button class="btn btn-medium" onclick="startGame('medium')">🟡 道館館主 (中等)</button>
        <button class="btn btn-hard" onclick="startGame('hard')">🔴 寶可夢大師 (困難)</button>
    </div>

    <!-- 遊戲進行區 -->
    <div id="gameScreen" class="game-screen">
        <div class="quiz-header">
            <span id="questionProgress">題目 1 / 5</span>
            <span id="currentScore">得分：0</span>
        </div>
        <div id="questionText" class="question-text">載入中...</div>
        <div id="optionsContainer" class="options-container"></div>
        <button id="nextBtn" class="next-btn" onclick="nextQuestion()">下一題</button>
    </div>

    <!-- 結果結算區 -->
    <div id="resultScreen" class="result-screen">
        <h2>挑戰完成！</h2>
        <div id="resultScore" class="result-score">0 / 5</div>
        <div id="resultComment" class="result-comment">評語載入中...</div>
        <button class="btn" onclick="resetGame()">返回主選單</button>
    </div>
</div>

<script>
    // 題庫資料庫 (分難度)
    const quizData = {
        easy: [
            {
                question: "精靈寶可夢動畫中，小智的第一隻同行夥伴兼招牌寶可夢是誰？",
                options: ["傑尼龜", "皮卡丘", "小火龍", "妙蛙種子"],
                answer: 1
            },
            {
                question: "全國圖鑑編號 #001 的寶可夢是哪一隻？",
                options: ["妙蛙種子", "皮卡丘", "小火龍", "木木梟"],
                answer: 0
            },
            {
                question: "伊布（Eevee）在沒有使用進化石或特定條件下，基礎屬性是什麼屬性？",
                options: ["一般系", "超能力系", "妖精系", "普通系（一般系）"],
                answer: 3
            },
            {
                question: "火箭隊三人組（武藏、小次郎、喵喵）口中時常出現的經典台詞，他們捕捉皮卡丘的目的是為了獻給誰？",
                options: ["板木老大", "小智", "大木博士", "冠軍"],
                answer: 0
            },
            {
                question: "請問鯉魚王進化之後會變成哪一隻強力的水/飛行系寶可夢？",
                options: ["暴鯉龍", "刺龍王", "美納斯", "快龍"],
                answer: 0
            }
        ],
        medium: [
            {
                question: "請問「幽靈系」寶可夢對哪一種屬性的招式完全免疫？",
                options: ["超能力系", "一般系與格鬥系", "飛行系", "惡系"],
                answer: 1
            },
            {
                question: "在第六世代（XY）中新加入，用來平衡龍屬性強勢地位的新屬性是？",
                options: ["鋼系", "妖精系", "惡系", "蟲系"],
                answer: 1
            },
            {
                question: "下列哪一隻傳說寶可夢被稱為「時空之神」，主掌時間？",
                options: ["帕路奇亞", "騎拉帝納", "帝牙盧卡", "阿爾宙斯"],
                answer: 2
            },
            {
                question: "寶可夢世界中，用來幫寶可夢恢復體力與治療異常狀態的最知名設施是？",
                options: ["寶可夢中心 (Pokémon Center)", "寶可夢商店", "友友球工廠", "對戰塔"],
                answer: 0
            },
            {
                question: "請問下列哪一隻御三家寶可夢的最終進化型是「草/幽靈」屬性？",
                options: ["狙射樹梟", "轟擂金剛猩", "魔幻假面喵", "土台龜"],
                answer: 0
            }
        ],
        hard: [
            {
                question: "在寶可夢本傳遊戲中，全遊戲基礎總和種族值（Base Stats Total）最高的單一寶可夢（不含特殊極巨化型態）是誰？",
                options: ["烈空坐", "種族值無上限的阿爾宙斯", "超級烈咬陸鯊", "無限型態 無極汰那（Eternamax）"],
                answer: 3
            },
            {
                question: "請問特性為「奇蹟守護（Wonder Guard）」的脫殼忍者（Shedinja），在對戰中只有什麼類型的攻擊能對它造成傷害？",
                options: ["物理攻擊", "效果絕佳（剋制屬性）的攻擊", "特殊攻擊", "屬性無效以外的攻擊"],
                answer: 1
            },
            {
                question: "百變怪（Ditto）在官方設定中，除了變身成看到的寶可夢外，還有哪一隻傳說寶可夢被廣泛推測是百變怪的失敗實驗品？",
                options: ["超夢", "夢幻", "百合根娃娃", "百變怪沒有原型"],
                answer: 1
            },
            {
                question: "請問第一世代（紅/綠版）中，因為程式碼漏洞而聞名、能透過特殊操作在舊版抓到的夢幻（Mew），其全國圖鑑編號是幾號？",
                options: ["#150", "#151", "#251", "#000"],
                answer: 1
            },
            {
                question: "在寶可夢的傷害計算公式中，若招式屬性與寶可夢自身屬性相符，會獲得額外的威力加成，這個加成通常被稱為？",
                options: ["STAB（Same Type Attack Bonus）", "CRIT 爆擊加成", "TYPE 屬性加乘", "BONUS 加成"],
                answer: 0
            }
        ]
    };

    let currentDifficulty = '';
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    function startGame(difficulty) {
        currentDifficulty = difficulty;
        currentQuestions = [...quizData[difficulty]];
        currentIndex = 0;
        score = 0;

        document.getElementById('difficultySelection').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';

        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        document.getElementById('nextBtn').style.display = 'none';
        
        const q = currentQuestions[currentIndex];
        document.getElementById('questionProgress').innerText = `題目 ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('currentScore').innerText = `得分：${score}`;
        document.getElementById('questionText').innerText = q.question;

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${String.fromCharCode(65 + intToAlpha(index))}. ${option}`;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function intToAlpha(i) {
        return i;
    }

    function selectOption(selectedIndex, btnElement) {
        if (answered) return;
        answered = true;

        const q = currentQuestions[currentIndex];
        const optionButtons = document.querySelectorAll('.option-btn');

        if (selectedIndex === q.answer) {
            btnElement.classList.add('correct');
            score += 20; // 5題每題20分
        } else {
            btnElement.classList.add('incorrect');
            optionButtons[q.answer].classList.add('correct'); // 顯示正確答案
        }

        // 鎖定所有選項
        optionButtons.forEach(btn => btn.disabled = true);

        // 顯示下一題按鈕
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';

        const maxScore = currentQuestions.length * 20;
        document.getElementById('resultScore').innerText = `${score} / ${maxScore} 分`;

        let comment = "";
        if (score === 100) {
            comment = "太神啦！你簡直是當之無愧的「寶可夢大師」！";
        } else if (score >= 60) {
            comment = "表現不錯！你已經是一位相當優秀的「道館館主」了！";
        } else {
            comment = "革命尚未成功，再多去草叢歷練歷練吧，初級訓練家！";
        }
        document.getElementById('resultComment').innerText = comment;
    }

    function resetGame() {
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('difficultySelection').style.display = 'flex';
    }
</script>

</body>
</html>
